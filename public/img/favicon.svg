  <!-- steam -->
  <path d="M26 15.5c0-2.6 2.6-2.6 2.6-5.2" stroke="#C98A34" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M36 15.5c0-2.6 2.6-2.6 2.6-5.2" stroke="#C98A34" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- cup -->
  <path d="M19.5 24h25l-2.6 14.2a6.4 6.4 0 0 1-6.3 5.3h-7.2a6.4 6.4 0 0 1-6.3-5.3z" fill="#F6ECD9"/>
  <!-- coffee surface -->
  <path d="M22 28.5h20" stroke="#C98A34" stroke-width="2.4" stroke-linecap="round"/>
  <!-- truck base -->
  <rect x="15" y="47.5" width="34" height="5.5" rx="2.75" fill="#C98A34"/>
  <!-- wheels -->
  <circle cx="22.5" cy="56" r="3.6" fill="#2A1B12"/>
  <circle cx="41.5" cy="56" r="3.6" fill="#2A1B12"/>
  <circle cx="22.5" cy="56" r="1.3" fill="#C98A34"/>
  <circle cx="41.5" cy="56" r="1.3" fill="#C98A34"/>
</svg>
